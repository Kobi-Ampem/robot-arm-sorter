[project]
name = "arm-sorter"
version = "0.1.0"
description = "Simulated robot arm that sorts tomatoes by ripeness"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "mujoco>=4.0.1",
    "numpy>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
